<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tree Maker · xmas-tree-kit</title>
    <meta name="description" content="Grow a fir, decorate it with ornaments, lights and garland, then download it or embed it in a web page." />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="stage" aria-label="Tree preview"></main>

    <header class="bar top">
      <h1>Tree Maker</h1>
      <span id="stats" class="muted" aria-live="polite"></span>
    </header>

    <section class="bar bottom" aria-label="Hang ornaments">
      <div class="modes" role="radiogroup" aria-label="Click action">
        <button type="button" data-mode="view" role="radio" aria-checked="true">View</button>
        <button type="button" data-mode="add" role="radio" aria-checked="false">Hang</button>
        <button type="button" data-mode="remove" role="radio" aria-checked="false">Remove</button>
      </div>
      <div id="shapes" class="shapes" role="radiogroup" aria-label="Ornament shape"></div>
      <div id="colors" class="colors" role="radiogroup" aria-label="Ornament color"></div>
      <span id="count" class="muted"></span>
    </section>

    <section class="bar actions" aria-label="Save and export">
      <button type="button" id="save">Save JSON</button>
      <label class="file">Open<input type="file" id="load" accept="application/json,.json" /></label>
      <button type="button" id="share">Copy link</button>
      <button type="button" id="embed">Copy embed code</button>
      <button type="button" id="glb-light">GLB (game)</button>
      <button type="button" id="glb">GLB (full)</button>
      <button type="button" id="png">PNG</button>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
