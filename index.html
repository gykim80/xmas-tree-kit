<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xmas-tree-kit</title>
    <meta name="description" content="전나무를 키우고 꾸며서 게임이나 웹페이지에 넣는 크리스마스트리 도구" />
    <style>
      body { margin: 0; font-family: system-ui, 'Apple SD Gothic Neo', sans-serif; background: #0b1530; color: #eef2fb; }
      main { max-width: 880px; margin: 0 auto; padding: 40px 20px 60px; }
      h1 { margin: 0 0 6px; font-size: 30px; }
      p { color: #b8c2d9; line-height: 1.6; }
      xmas-tree { height: 440px; border-radius: 16px; overflow: hidden; margin: 22px 0; }
      nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
      a { display: block; padding: 14px 16px; border-radius: 12px; background: rgba(255, 255, 255, 0.07); color: #fff; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.12); }
      a:hover, a:focus-visible { background: rgba(255, 255, 255, 0.14); }
      a small { display: block; color: #a8b3cc; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>xmas-tree-kit</h1>
      <p>전나무를 씨앗값 하나로 키우고, 오너먼트·전구·갈런드·선물로 꾸밉니다. 만든 트리는 JSON 으로 저장하고, GLB 로 내려받아 게임 엔진에 넣거나, 태그 하나로 웹페이지에 띄웁니다.</p>
      <xmas-tree preset="classic" auto-rotate camera-controls snowfall></xmas-tree>
      <nav>
        <a href="./editor/">트리 만들기<small>조절하고 오너먼트를 달고 내려받기</small></a>
        <a href="./examples/embed.html">웹페이지에 넣기<small>&lt;xmas-tree&gt; 태그 예제</small></a>
        <a href="./examples/basic.html">내 장면에 넣기<small>코드로 트리 세 그루</small></a>
        <a href="./examples/game.html">게임 속 트리<small>숲을 걸으며 오너먼트 달기</small></a>
      </nav>
    </main>
    <script type="module">
      import './src/element-define.js';
    </script>
  </body>
</html>
